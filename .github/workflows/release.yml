name: Release

# Runs when a release is published on GitHub ("Create a new release" with a tag vX.Y.Z).
#
# Before publishing a release:
#   - set the version in package.json (e.g. `npm version patch --no-git-tag-version`),
#   - add a section "## [X.Y.Z] - date" to CHANGELOG.md,
#   - commit and push to main.
#
# The workflow checks the version, runs all tests, builds the extension package and
# attaches the ZIP file to the release. If anything fails, the release is turned back
# into a draft, so that no release without a tested package stays published.

on:
  release:
    types: [published]

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
  CHROMEDRIVER_SKIP_DOWNLOAD: 'true'

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match package.json and CHANGELOG.md
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag '$TAG_NAME' must have the format vX.Y.Z (e.g. v0.1.2)."
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          PACKAGE=$(node -p "require('./package.json').version")

          if [ "$VERSION" != "$PACKAGE" ]; then
            echo "::error::Tag $TAG_NAME does not match the version $PACKAGE in package.json."
            exit 1
          fi

          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [$VERSION]'."
            exit 1
          fi

  test:
    name: Tests
    needs: check
    uses: ./.github/workflows/test.yml

  package:
    name: Build and attach package
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, zip
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build extension package
        run: |
          npm ci
          npm run extension

      - name: Attach package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" build/*.zip --clobber --repo "$GITHUB_REPOSITORY"

  revert-to-draft:
    name: Revert release to draft on failure
    needs: [check, test, package]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Turn the release back into a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$TAG_NAME" --draft=true --repo "$GITHUB_REPOSITORY"
          echo "::warning::The release $TAG_NAME was turned back into a draft because the checks failed."
